<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>जय भवानी मेडिकल — अॅडमिन</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF9F4; --panel:#FFFFFF; --ink:#1C2B2A; --ink-soft:#5B6B69;
    --teal:#0F6B5C; --teal-dark:#0A3F38; --teal-light:#16876F; --marigold:#E3A008;
    --line:#E7E1D4; --danger:#B3452F;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Work Sans',sans-serif; padding-bottom:40px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  header{
    background:linear-gradient(135deg, var(--teal-light) 0%, var(--teal) 55%, var(--teal-dark) 100%);
    color:#fff; padding:20px 16px;
    border-radius:0 0 22px 22px; position:sticky; top:0; z-index:10;
    box-shadow:0 6px 20px rgba(10,63,56,0.25);
  }
  header h1{font-size:21px;}
  header p{margin:4px 0 0; font-size:12px; color:#BFE4D9;}
  .lock-screen{
    max-width:340px; margin:80px auto; background:var(--panel);
    padding:26px; border-radius:16px; border:1px solid var(--line); text-align:center;
  }
  .lock-screen input{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    font-size:16px; text-align:center; letter-spacing:4px; margin:14px 0;
  }
  .tabs{display:flex; gap:8px; padding:14px 16px 0;}
  .tab{
    padding:9px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); font-size:13.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer;
  }
  .tab.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  main{padding:16px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px;
  }
  .row{display:flex; gap:10px;}
  .field{margin-bottom:10px; flex:1;}
  .field label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .field input, .field select{
    width:100%; padding:10px; border-radius:9px; border:1px solid var(--line);
    font-family:'Work Sans'; font-size:14px; background:#fff; color:var(--ink);
  }
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:13.5px;}
  .btn{
    border:none; padding:11px 16px; border-radius:10px; font-weight:700;
    font-size:14px; cursor:pointer;
  }
  .btn-primary{background:var(--teal); color:#fff; width:100%;}
  .btn-danger{background:#FBEAE6; color:var(--danger);}
  .btn-small{padding:7px 12px; font-size:12.5px;}
  .product-item{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .product-item .emoji{font-size:26px;}
  .product-item .info{flex:1;}
  .product-item .pname{font-weight:600; font-size:14px;}
  .product-item .pmeta{font-size:12px; color:var(--ink-soft);}
  .product-item .actions{display:flex; gap:6px;}
  .order-card{margin-bottom:12px;}
  .order-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .order-id{font-weight:700; font-size:14px;}
  .status-badge{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .status-Placed{background:#FEF3D6; color:#8A6300;}
  .status-Packed{background:#E1EFFB; color:#22588A;}
  .status-Out-for-delivery{background:#EBE1FB; color:#5B2A8A;}
  .status-Delivered{background:#DFF3E9; color:#1F7A4D;}
  .order-line{font-size:13px; color:var(--ink-soft); margin:2px 0;}
  .order-items{font-size:12.5px; color:var(--ink-soft); margin:8px 0; padding-left:14px;}
  .empty-msg{text-align:center; color:var(--ink-soft); padding:30px; font-size:14px;}
  select.status-select{
    margin-top:8px; width:100%; padding:9px; border-radius:9px; border:1px solid var(--line);
  }
  #photoPreview img{
    width:70px; height:70px; object-fit:cover; border-radius:10px; border:1px solid var(--line);
  }
  .product-item img.thumb{
    width:44px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0;
  }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <h2>अॅडमिन लॉगिन</h2>
  <p style="color:var(--ink-soft); font-size:13.5px; margin-top:8px;">पुढे जाण्यासाठी दुकानाचा पिन टाका</p>
  <input type="password" id="pinInput" placeholder="पिन टाका" maxlength="6">
  <button class="btn btn-primary" id="pinSubmit">अनलॉक करा</button>
  <p id="pinError" style="color:var(--danger); font-size:12.5px; display:none;">चुकीचा पिन, पुन्हा प्रयत्न करा.</p>
</div>

<div id="adminApp" style="display:none;">
  <header>
    <h1>Jay Bhavani Medical</h1>
    <p>चांदेकसारे · अॅडमिन पॅनेल</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="products">उत्पादने</div>
    <div class="tab" data-tab="orders">ऑर्डर्स</div>
  </div>

  <main>
    <!-- PRODUCTS TAB -->
    <div id="tab-products">
      <div class="card">
        <h3 style="margin-bottom:12px; font-size:15px;">नवीन औषध जोडा</h3>
        <div class="field">
          <label>फोटो</label>
          <input type="file" id="newPhoto" accept="image/*" capture="environment">
          <div id="photoPreview" style="margin-top:8px;"></div>
        </div>
        <div class="field">
          <label>औषधाचे नाव</label>
          <input type="text" id="newName" placeholder="उदा. Paracetamol 500mg">
        </div>
        <div class="field">
          <label>प्रकार (Category)</label>
          <select id="newCat">
            <option value="डोकेदुखी">डोकेदुखी (Headache)</option>
            <option value="ताप">ताप (Fever)</option>
            <option value="खोकला">खोकला (Cough)</option>
            <option value="सर्दी">सर्दी (Cold)</option>
            <option value="घसा खवखवणे">घसा खवखवणे (Sore Throat)</option>
            <option value="पोटदुखी">पोटदुखी (Stomach Pain)</option>
            <option value="गॅस आणि अ‍ॅसिडिटी">गॅस आणि अ‍ॅसिडिटी</option>
            <option value="जुलाब">जुलाब (Loose Motion)</option>
            <option value="बद्धकोष्ठता">बद्धकोष्ठता (Constipation)</option>
            <option value="अंगदुखी">अंगदुखी (Body Pain)</option>
            <option value="सांधेदुखी">सांधेदुखी (Joint Pain)</option>
            <option value="प्रतिजैविके">प्रतिजैविके (Antibiotics)</option>
            <option value="त्वचेची काळजी">त्वचेची काळजी (Skin Care)</option>
            <option value="अ‍ॅलर्जी">अ‍ॅलर्जी (Allergy)</option>
            <option value="डोळ्यांची काळजी">डोळ्यांची काळजी (Eye Care)</option>
            <option value="कानाची काळजी">कानाची काळजी (Ear Care)</option>
            <option value="दातांची काळजी">दातांची काळजी (Dental Care)</option>
            <option value="मधुमेह काळजी">मधुमेह काळजी (Diabetes Care)</option>
            <option value="रक्तदाब">रक्तदाब (Blood Pressure)</option>
            <option value="महिलांचे आरोग्य">महिलांचे आरोग्य (Women's Health)</option>
            <option value="बाळाची काळजी">बाळाची काळजी (Baby Care)</option>
            <option value="आरोग्य व जीवनसत्त्वे">आरोग्य व जीवनसत्त्वे (Wellness)</option>
            <option value="प्रथमोपचार">प्रथमोपचार (First Aid)</option>
            <option value="उपकरणे">उपकरणे (Devices)</option>
            <option value="सर्वसाधारण">सर्वसाधारण (General)</option>
          </select>
        </div>
        <div class="field">
          <label>किंमत (₹)</label>
          <input type="number" id="newPrice" placeholder="उदा. 20">
        </div>
        <div class="field">
          <label>साठा (माहित नसल्यास रिकामे ठेवा)</label>
          <input type="number" id="newStock" placeholder="उदा. 40">
        </div>
        <button class="btn btn-primary" id="addProductBtn">औषध जोडा</button>
        <p id="addStatus" style="font-size:12.5px; color:var(--ink-soft); margin-top:8px; display:none;"></p>
      </div>

      <div class="card">
        <h3 style="margin-bottom:6px; font-size:15px;">सध्याचा साठा</h3>
        <div id="productList"></div>
      </div>
    </div>

    <!-- ORDERS TAB -->
    <div id="tab-orders" style="display:none;">
      <div id="ordersList"></div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCTZZZSpsXBki2IvFeHX8vB6IuUnhPLWa4",
  authDomain: "medical-1f0af.firebaseapp.com",
  projectId: "medical-1f0af",
  storageBucket: "medical-1f0af.firebasestorage.app",
  messagingSenderId: "67439356495",
  appId: "1:67439356495:web:e6bf86777d3a28343f983a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const productsCol = collection(db, "products");
const ordersCol = collection(db, "orders");

// ---------------- Simple PIN lock (not real security, just keeps casual visitors out) ----------------
const ADMIN_PIN = "1234"; // change this to whatever PIN the shop owner wants
document.getElementById('pinSubmit').addEventListener('click', unlockCheck);
document.getElementById('pinInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') unlockCheck(); });

function unlockCheck(){
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('adminApp').style.display = 'block';
    startListeners();
  } else {
    document.getElementById('pinError').style.display = 'block';
  }
}

// ---------------- Tabs ----------------
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.getAttribute('data-tab');
    document.getElementById('tab-products').style.display = target==='products' ? 'block' : 'none';
    document.getElementById('tab-orders').style.display = target==='orders' ? 'block' : 'none';
  });
});

// ---------------- Photo compression (resize + compress in browser, no server needed) ----------------
function compressImage(file, maxSize = 500, quality = 0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height){
          if(width > maxSize){ height *= maxSize / width; width = maxSize; }
        } else {
          if(height > maxSize){ width *= maxSize / height; height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------------- Photo preview ----------------
document.getElementById('newPhoto').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  const preview = document.getElementById('photoPreview');
  if(file){
    const url = URL.createObjectURL(file);
    preview.innerHTML = `<img src="${url}">`;
  } else {
    preview.innerHTML = '';
  }
});

// ---------------- Products ----------------
document.getElementById('addProductBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newName').value.trim();
  const cat = document.getElementById('newCat').value;
  const price = parseFloat(document.getElementById('newPrice').value);
  const stockRaw = document.getElementById('newStock').value;
  const stock = stockRaw ? parseInt(stockRaw) : 100;
  const photoFile = document.getElementById('newPhoto').files[0];

  if(!name || isNaN(price)){
    alert("कृपया किमान औषधाचे नाव आणि किंमत टाका.");
    return;
  }

  const btn = document.getElementById('addProductBtn');
  const statusMsg = document.getElementById('addStatus');
  btn.disabled = true;
  btn.textContent = "जोडत आहे...";
  statusMsg.style.display = 'block';

  try{
    let imageUrl = null;
    if(photoFile){
      statusMsg.textContent = "फोटो प्रोसेस होत आहे...";
      imageUrl = await compressImage(photoFile);
    }

    statusMsg.textContent = "औषध साठवत आहे...";
    await addDoc(productsCol, {
      name, price, stock,
      cat: cat,
      rx: false,
      emoji: "💊",
      imageUrl: imageUrl
    });

    document.getElementById('newName').value = '';
    document.getElementById('newPrice').value = '';
    document.getElementById('newStock').value = '';
    document.getElementById('newPhoto').value = '';
    document.getElementById('photoPreview').innerHTML = '';
    statusMsg.textContent = "जोडले!";
    setTimeout(()=>{ statusMsg.style.display = 'none'; }, 1500);
  } catch(err){
    alert("औषध जोडता आले नाही. इंटरनेट कनेक्शन तपासा.");
    console.error(err);
    statusMsg.style.display = 'none';
  } finally {
    btn.disabled = false;
    btn.textContent = "औषध जोडा";
  }
});

function startListeners(){
  onSnapshot(productsCol, (snap)=>{
    const products = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderProductList(products);
  });

  const ordersQuery = query(ordersCol, orderBy("createdAt", "desc"));
  onSnapshot(ordersQuery, (snap)=>{
    const orders = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderOrders(orders);
  });
}

function renderProductList(products){
  const container = document.getElementById('productList');
  if(products.length === 0){
    container.innerHTML = `<p class="empty-msg">अजून औषधे नाहीत. वरती पहिले औषध जोडा.</p>`;
    return;
  }
  container.innerHTML = products.map(p=>`
    <div class="product-item">
      ${p.imageUrl ? `<img class="thumb" src="${p.imageUrl}">` : `<span class="emoji">${p.emoji || '💊'}</span>`}
      <div class="info">
        <div class="pname">${p.name}</div>
        <div class="pmeta">₹${p.price} · Stock: ${p.stock}</div>
      </div>
      <div class="actions">
        <button class="btn btn-small" data-action="edit-stock" data-id="${p.id}" data-stock="${p.stock}" data-price="${p.price}">बदला</button>
        <button class="btn btn-danger btn-small" data-action="delete" data-id="${p.id}">काढा</button>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(confirm("हे औषध दुकानातून काढायचे का?")){
        await deleteDoc(doc(db, "products", btn.getAttribute('data-id')));
      }
    });
  });

  container.querySelectorAll('[data-action="edit-stock"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      const currentStock = btn.getAttribute('data-stock');
      const currentPrice = btn.getAttribute('data-price');
      const newStock = prompt("साठा अपडेट करा:", currentStock);
      if(newStock === null) return;
      const newPrice = prompt("किंमत अपडेट करा (₹):", currentPrice);
      if(newPrice === null) return;
      await updateDoc(doc(db, "products", id), {
        stock: parseInt(newStock),
        price: parseFloat(newPrice)
      });
    });
  });
}

function renderOrders(orders){
  const container = document.getElementById('ordersList');
  if(orders.length === 0){
    container.innerHTML = `<p class="empty-msg">अजून ऑर्डर नाहीत.</p>`;
    return;
  }
const statuses = ["Placed","Packed","Out for delivery","Delivered"];
// To rename delivery staff later, just edit the two names below.
const DELIVERY_BOYS = ["Delivery Boy 1", "Delivery Boy 2"];
  container.innerHTML = orders.map(o=>{
    const itemsHtml = (o.items||[]).map(i=>`<li>${i.qty} × ${i.name}</li>`).join('');
    const statusClass = "status-" + (o.status||"Placed").replace(/ /g,'-');
    return `
    <div class="card order-card">
      <div class="order-head">
        <span class="order-id">${o.customerName}</span>
        <span class="status-badge ${statusClass}">${o.status||'Placed'}</span>
      </div>
      <div class="order-line">📞 ${o.phone}</div>
      <div class="order-line">📍 ${o.address}</div>
      <ul class="order-items">${itemsHtml}</ul>
      <div class="order-line" style="font-weight:700; color:var(--ink);">Total: ₹${o.total}</div>
      <label style="font-size:11.5px; color:var(--ink-soft); display:block; margin-top:10px;">ऑर्डर स्थिती</label>
      <select class="status-select" data-id="${o.id}" data-field="status" data-phone="${o.phone}">
        ${statuses.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
      </select>
      <label style="font-size:11.5px; color:var(--ink-soft); display:block; margin-top:10px;">डिलिव्हरी नेमा</label>
      <select class="status-select" data-id="${o.id}" data-field="deliveryBoy">
        <option value="" ${!o.deliveryBoy?'selected':''}>अजून नेमलेले नाही</option>
        ${DELIVERY_BOYS.map(name=>`<option value="${name}" ${name===o.deliveryBoy?'selected':''}>${name}</option>`).join('')}
      </select>
    </div>`;
  }).join('');

  // Marathi status wording shown to the customer in the WhatsApp message
  const STATUS_MESSAGE_MARATHI = {
    "Placed": "तुमची ऑर्डर मिळाली आहे.",
    "Packed": "तुमची ऑर्डर पॅक झाली आहे.",
    "Out for delivery": "तुमची ऑर्डर डिलिव्हरीसाठी निघाली आहे.",
    "Delivered": "तुमची ऑर्डर डिलिव्हर झाली आहे. धन्यवाद!"
  };

  container.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const field = sel.getAttribute('data-field');
      const orderId = sel.getAttribute('data-id');
      await updateDoc(doc(db, "orders", orderId), { [field]: sel.value });

      // When the order status changes, open WhatsApp to the customer's number
      // with a ready-made status update — just tap Send.
      if(field === 'status'){
        const phone = sel.getAttribute('data-phone');
        const orderShort = orderId.slice(0,8).toUpperCase();
        const statusText = STATUS_MESSAGE_MARATHI[sel.value] || `स्थिती अपडेट: ${sel.value}`;
        const msg = `जय भवानी मेडिकल, चांदेकसारे\nऑर्डर #${orderShort}\n\n${statusText}`;
        const waUrl = `https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');
      }
    });
  });
}
</script>

</body>
</html>
